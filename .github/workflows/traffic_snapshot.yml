name: Traffic Monitor Snapshot

on:
  workflow_dispatch:
    inputs:
      job_type:
        description: "Which job to run (snapshot or dedup)"
        default: "snapshot"
        type: choice
        options:
          - snapshot
          - dedup

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml

      - name: Daily deduplication
        id: dedup
        if: ${{ inputs.job_type == 'dedup' }}
        run: |
          dedup_output="$(uv run --group scraping tools/fix_timestamps.py --apply)"
          echo "$dedup_output"
          removed="$(printf '%s\n' "$dedup_output" | awk -F: '/Old duplicates removed/ {gsub(/[ ,]/, "", $2); print $2; exit}')"
          if [ -z "$removed" ]; then
            removed=0
          fi
          echo "removed=$removed" >> "$GITHUB_OUTPUT"

      - name: Run weather snapshot
        # Non-fatal: an AccuWeather outage must not lose the traffic snapshot.
        continue-on-error: true
        if: >-
          ${{
            inputs.job_type == 'snapshot'
            || inputs.job_type == ''
          }}
        run: uv run --group scraping tools/weather.py --json

      - name: Run traffic snapshot and append to CSV
        id: snapshot
        if: >-
          ${{
            inputs.job_type == 'snapshot'
            || inputs.job_type == ''
          }}
        run: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          uv run --group scraping tools/traffic_snapshot.py > /tmp/snapshot_output.txt
          head -n -1 /tmp/snapshot_output.txt >> data/csv-traffic-bangalore.csv
          message="$(tail -n 1 /tmp/snapshot_output.txt)"
          echo "$message"
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: Generate calendar anomaly export
        id: calendar_export
        # Derived from the traffic CSV, so it runs after both the snapshot and
        # the dedup path. Non-fatal: a scorer failure must not discard the
        # collected traffic data.
        continue-on-error: true
        run: uv run python tools/generate_calendar_exports.py

      - name: Withdraw the stale calendar export when generation failed
        # The export is derived data, and the commit step below re-stages it, so
        # a failed run would otherwise keep publishing yesterday's colours as if
        # they were current. Removing the file makes the failure visible: the
        # dashboard renders an explicit "comparisons unavailable" state instead.
        # The commit step stays ungated so the collected traffic is still saved.
        if: steps.calendar_export.outcome == 'failure'
        run: |
          rm -f data/csv-calendar-anomalies-bangalore.csv
          echo "::warning title=Calendar export failed::Removed the stale export; the dashboard will report comparisons unavailable until the next successful run."

      - name: Compose commit message
        id: commit_message
        run: |
          if [ "${{ inputs.job_type }}" = "dedup" ]; then
            removed="${{ steps.dedup.outputs.removed }}"
            echo "message=dedup: $removed records removed" >> "$GITHUB_OUTPUT"
          else
            echo "message=${{ steps.snapshot.outputs.message }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          # Remove stale files from old workflow versions if present
          git rm --cached --ignore-unmatch weather.md weather_snapshot.csv || true
          rm -f weather.md weather_snapshot.csv

          # Stage outputs to commit them (include uv.lock — uv rewrites it on
          # every run). git add fails the whole invocation when a pathspec
          # matches nothing, and the `|| true` that used to paper over that
          # meant one absent output silently dropped every output — including
          # the collected traffic. Stage each path on its own instead: present
          # files plainly, absent ones only when git already tracks them, so an
          # intentional removal (a withdrawn calendar export) is recorded as a
          # deletion rather than being skipped.
          for path in data/csv-traffic-bangalore.csv \
                      data/csv-weather-snapshot.csv \
                      data/csv-calendar-anomalies-bangalore.csv \
                      uv.lock; do
            if [ -e "$path" ]; then
              git add -- "$path"
            elif git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git add -u -- "$path"
            else
              echo "skipping untracked absent path: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "${{ steps.commit_message.outputs.message }}"

          # Push to remote. If rejected (remote diverged), fetch+rebase and retry.
          # uv.lock must be staged because uv rewrites it on every run; without this,
          # the leftover diff causes "unstaged changes" errors on rebase/pull.
          git push origin HEAD:main || {
            echo "Push rejected — rebasing on remote changes..."
            git fetch origin main
            # -X ours prefers origin/main for content conflicts: during a rebase
            # "ours" is the upstream side. A withdrawn calendar export conflicts
            # differently — the commit deletes a file the remote modified, and a
            # modify/delete conflict stops the rebase with a nonzero exit that
            # would otherwise abort the step before the push, dropping the
            # collected traffic. The rebase failure is therefore expected and
            # handled: resolve, continue, then push.
            if ! git rebase origin/main -X ours; then
              export GIT_EDITOR=true
              if git ls-files --unmerged --error-unmatch -- data/csv-calendar-anomalies-bangalore.csv >/dev/null 2>&1; then
                echo "calendar export withdrew locally; keeping the removal"
                git rm -q -f -- data/csv-calendar-anomalies-bangalore.csv
              fi
              for path in $(git diff --name-only --diff-filter=U); do
                echo "other conflict on $path — keeping the origin/main version"
                git checkout origin/main -- "$path"
                git add -- "$path"
              done
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "unresolved conflicts remain; refusing to push" >&2
                exit 1
              fi
              git rebase --continue
            fi
            git push --force-with-lease origin HEAD:main
          }